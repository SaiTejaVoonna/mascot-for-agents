name: Build mascot collection
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/build-collection.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mascot-collection
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Render and validate before publishing
        shell: bash
        run: |
          set +e
          {
            python -m compileall -q tools &&
            node --check site/app.js &&
            python tools/build_collection.py &&
            python tools/validate_catalog.py &&
            python tools/check_claude_shape.py &&
            node tools/check_gallery.cjs
          } > docs/build-report.txt 2>&1
          result=$?
          cat docs/build-report.txt
          git config user.name "mascot-build[bot]"
          git config user.email "mascot-build@users.noreply.github.com"
          if [ "$result" -eq 0 ]; then
            git add assets/collection/gpt-v5 assets/collection/claude-v5 packs/*-58-emotes-v5.zip site/catalog.json docs/build-report.txt docs/qa-dark.png docs/qa-light-mobile.png
            git diff --cached --quiet || git commit -m "Publish validated v5 mascot stickers, loops and source packs"
          else
            git add docs/build-report.txt
            git diff --cached --quiet || git commit -m "Record mascot build diagnostics"
          fi
          git fetch origin main || exit 1
          git rebase origin/main || exit 1
          git push origin HEAD:main || exit 1
          exit "$result"
