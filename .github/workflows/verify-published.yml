name: Verify published gallery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-published.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check actual Pages gallery and all download URLs
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const base='https://saitejavoonna.github.io/mascot-for-agents/';
            const browser=await chromium.launch();
            try {
              const page=await browser.newPage({viewport:{width:1280,height:1000},colorScheme:'light'});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              let ready=false;
              for(let i=0;i<12;i++){
                const r=await page.goto(base+'?qa='+Date.now(),{waitUntil:'networkidle'});
                if(r.status()===200 && await page.locator('#result').textContent()==='116 reactions · transparent stickers'){ready=true;break}
                await page.waitForTimeout(10000);
              }
              assert(ready,'Published gallery did not become ready');
              const catalogResponse=await page.request.get(base+'site/catalog.json?qa='+Date.now());
              assert.equal(catalogResponse.status(),200);
              const catalog=await catalogResponse.json();assert.equal(catalog.version,3);assert.equal(catalog.expressions.length,58);
              const jobs=[];
              for(const m of catalog.mascots){
                assert(m.base.includes('-v5/'));
                for(const e of catalog.expressions)for(const ext of ['png','gif','webp']){
                  jobs.push({url:new URL(m.base+e.id+'.'+ext,base+'site/').href,ext});
                }
                jobs.push({url:new URL(m.pack,base+'site/').href,ext:'zip'});
              }
              let checked=0;
              await Promise.all(Array.from({length:8},async()=>{
                for(let j;j=jobs.pop();){
                  const r=await page.request.get(j.url);assert.equal(r.status(),200,j.url);
                  const b=await r.body();assert(b.length>20,j.url);
                  if(j.ext==='png')assert.equal(b.toString('hex',0,8),'89504e470d0a1a0a',j.url);
                  if(j.ext==='gif')assert(b.toString('ascii',0,3)==='GIF',j.url);
                  if(j.ext==='webp')assert(b.toString('ascii',8,12)==='WEBP',j.url);
                  if(j.ext==='zip')assert(b.toString('ascii',0,2)==='PK',j.url);
                  checked++;
                }
              }));
              await page.getByRole('button',{name:'Switch to dark mode',exact:true}).click();
              await page.reload({waitUntil:'networkidle'});
              assert.equal(await page.locator('html').getAttribute('data-theme'),'dark');
              await page.locator('#collection').scrollIntoViewIfNeeded();
              await page.screenshot({path:'published-dark.png'});
              await page.getByRole('searchbox').fill('dancing');
              await page.getByText('2 reactions · transparent stickers',{exact:true}).waitFor();
              await page.getByRole('button',{name:'Animated',exact:false}).click();
              await page.getByRole('button',{name:'Preview Claude Dancing',exact:true}).click();
              await page.locator('#detail-image').evaluate(i=>i.decode());
              assert((await page.locator('#detail-image').getAttribute('src')).includes('dancing.gif'));
              await page.getByRole('button',{name:'Close preview',exact:true}).click();
              await page.getByRole('button',{name:'Switch to light mode',exact:true}).click();
              await page.getByRole('button',{name:'Reset filters',exact:true}).click();
              await page.setViewportSize({width:390,height:844});
              await page.locator('#collection').scrollIntoViewIfNeeded();
              await page.screenshot({path:'published-mobile.png'});
              assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'Mobile overflow');
              assert.deepEqual(errors,[]);
              console.log('LIVE VERIFIED: gallery loads, all '+checked+' downloads return 200 with valid file signatures, dark mode persists, dancing GIF plays, mobile layout fits; no JavaScript errors.');
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-gallery-previews
          path: |
            published-dark.png
            published-mobile.png
