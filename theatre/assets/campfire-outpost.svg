<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <title>Little Theatre — campfire outpost</title>
  <desc>Original code-drawn campsite: a small tent, landing pod, mountain silhouettes and a stone fire ring. Character contact points are 283,351 and 710,351; fire centre is 480,350.</desc>
